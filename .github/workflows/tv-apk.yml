name: Build TV APK

# Builds tv-app/ and ships the signed APK to ladybird at ~/apks/ladybird-tv.apk -
# the stable path the home-automation repo's TV provisioning script installs
# from. Runs only when tv-app/ changes; the web dashboard's own deploy is
# deploy.yml and is untouched by this.
#
# Signing: CI signs with the fleet keystore from the prod environment secrets
# (TV_KEYSTORE_B64 + TV_KEYSTORE_PASSWORD). One stable key is what lets
# `adb install -r` upgrade the app in place - per-runner debug keys would make
# every build signature-incompatible with the last. The keystore master copy
# lives OFF-repo (Thomas's machine); losing it means uninstall/reinstall on
# every TV, nothing worse.
#
# Network path is deploy.yml's: ephemeral tag:ci tailnet node -> ladybird over
# tcp/22 at its Tailscale IP.
on:
  push:
    branches: [main]
    paths:
      - "tv-app/**"
      - ".github/workflows/tv-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-apk
  cancel-in-progress: false

env:
  LADYBIRD_TS_IP: 100.69.144.83
  LADYBIRD_USER: thomas

jobs:
  build-and-ship:
    name: build + ship APK
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image rotates its preinstalled Android platforms; pin ours.
      - name: Ensure Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' > /dev/null

      - name: Build signed release APK
        env:
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        working-directory: tv-app
        run: |
          printf '%s' "$TV_KEYSTORE_B64" | base64 -d > /tmp/tv.keystore
          TV_KEYSTORE_FILE=/tmp/tv.keystore ./gradlew --no-daemon assembleRelease
          rm -f /tmp/tv.keystore
          ls -la app/build/outputs/apk/release/app-release.apk

      # The artifact is provenance/debugging; ladybird is the consumer.
      - uses: actions/upload-artifact@v4
        with:
          name: ladybird-tv-apk
          path: tv-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Join tailnet (ephemeral tag:ci node)
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ci_deploy && chmod 600 ~/.ssh/ci_deploy
          cat > ~/.ssh/config <<CFG
          Host ladybird
            HostName $LADYBIRD_TS_IP
            User $LADYBIRD_USER
            IdentityFile ~/.ssh/ci_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
          CFG
          sed -i 's/^ *//' ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Ship APK to ladybird
        run: |
          ssh ladybird 'mkdir -p ~/apks'
          scp tv-app/app/build/outputs/apk/release/app-release.apk ladybird:~/apks/ladybird-tv.apk.new
          # Atomic swap so a provisioning run never reads a half-copied APK.
          ssh ladybird 'mv ~/apks/ladybird-tv.apk.new ~/apks/ladybird-tv.apk && ls -la ~/apks/'
