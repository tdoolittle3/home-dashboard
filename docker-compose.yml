# Builds and runs the dashboard from this checkout. Handy for testing the
# container locally; on ladybird the deployment lives in the home-automation
# repo under stacks/dash/ so all of that host's compose files stay together.
services:
  dashboard:
    build: .
    image: home-dashboard:local
    container_name: home-dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      # Same mapping as the deployed stack: the app listens on 8099 inside the
      # container (it runs as the non-root `node` user, which cannot bind 80)
      # and the host publishes it on the default http port.
      - "80:8099"
    volumes:
      # Edit panels without rebuilding the image; restart to pick them up.
      - ./config/dashboard.json:/app/config/dashboard.json:ro
    environment:
      DASHBOARD_CONFIG: /app/config/dashboard.json
